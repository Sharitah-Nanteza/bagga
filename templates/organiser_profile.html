<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bagga | Organiser Profile</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--panel:#fff;--panel-alt:#eef5f3;--ink:#17212f;--muted:#667085;--line:#dfe7e4;--primary:#1b6f5f;--primary-soft:#dff6f0;--danger-soft:#fde9e5;--shadow:0 16px 36px rgba(18,31,36,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(180deg,#f7faf9,#edf2f1);color:var(--ink)}a{color:inherit;text-decoration:none}.shell{max-width:1000px;margin:auto;padding:24px 18px 60px}.topbar{display:flex;justify-content:space-between;gap:16px;padding:14px 18px;background:#ffffffb3;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);position:sticky;top:14px;z-index:2}.brand{font-weight:800}.nav{display:flex;gap:10px}.nav a{color:var(--muted);font-weight:700;font-size:13px}.grid{display:grid;grid-template-columns:1fr .85fr;gap:20px;margin-top:25px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px}.eyebrow{color:var(--primary);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.avatar{width:62px;height:62px;display:grid;place-items:center;border-radius:18px;background:var(--primary-soft);color:var(--primary);font-size:24px;font-weight:800;margin:16px 0}h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.05;letter-spacing:-.07em;margin:0 0 12px}.lead,p{color:var(--muted);line-height:1.6}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:7px 10px;border-radius:999px;background:var(--panel-alt);color:var(--primary);font-size:12px;font-weight:700}.weather{margin-top:22px;padding:15px;border-radius:14px;background:var(--panel-alt);color:var(--primary);font-size:14px;font-weight:700}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}label{font-size:13px;color:var(--muted);font-weight:700}input,textarea,select{padding:13px 14px;border:1px solid var(--line);border-radius:11px;font:inherit;color:var(--ink);background:#fff}textarea{min-height:100px;resize:vertical}.button{width:100%;border:0;border-radius:11px;padding:14px;background:var(--primary);color:#fff;font:inherit;font-weight:800;cursor:pointer}.button:disabled{opacity:.65;cursor:wait}.state{display:none;padding:14px;border-radius:12px;margin-top:14px;font-size:14px;line-height:1.5}.state.show{display:block}.success{background:var(--primary-soft);color:var(--primary)}.error{background:var(--danger-soft);color:#9d3529}.access{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}.access a{color:var(--primary);font-weight:700}@media(max-width:720px){.topbar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.panel{padding:21px}}
</style></head><body><main class="shell"><header class="topbar"><a class="brand" href="{{ url_for('home') }}">BAGGA</a><nav class="nav"><a href="{{ url_for('marketplace') }}">Back to marketplace</a><a href="{{ url_for('attendee') }}">USSD / Voice feedback</a></nav></header><div class="grid"><section id="profile" class="panel"><p>Loading organiser profile...</p></section><section class="panel"><span class="eyebrow">Send invitation</span><h2>Start the conversation</h2><p>Share the essentials. The organiser will receive an SMS notification.</p><form id="bookingForm"><div class="field"><label for="eventDate">Event date</label><input id="eventDate" name="event_date" type="date" required></div><div class="field"><label for="eventType">Event type</label><select id="eventType" name="event_type" required><option value="">Choose a category</option>{% for event_type in ['wedding','corporate','concert','religious','community','conference','other'] %}<option value="{{ event_type }}">{{ event_type|title }}</option>{% endfor %}</select></div><div class="field"><label for="location">Location</label><input id="location" name="location" required placeholder="Kampala, Uganda"></div><div class="field"><label for="notes">Notes</label><textarea id="notes" name="notes" placeholder="Guest count, style, budget, or anything useful"></textarea></div><button id="sendButton" class="button">Send invitation</button><div id="state" class="state" role="status"></div></form></section></div><p class="access">No smartphone? <a href="{{ url_for('attendee') }}">USSD / voice feedback remains available</a>.</p></main><script>
const organiserId='{{ organiser_id }}',profile=document.getElementById('profile'),form=document.getElementById('bookingForm'),state=document.getElementById('state'),button=document.getElementById('sendButton');
async function load(){try{const response=await fetch('/api/organisers/'+organiserId);const data=await response.json();if(!response.ok)throw new Error(data.message);const item=data.organiser;profile.innerHTML=`<span class="eyebrow">Organiser profile</span><div class="avatar">${item.organisation_name.slice(0,1).toUpperCase()}</div><h1>${item.organisation_name}</h1><p class="lead">${item.bio}</p><div class="chips">${item.event_types.map(type=>`<span class="chip">${type}</span>`).join('')}</div>${data.weather?`<div class="weather">Event-day weather: ${data.weather}</div>`:''}`;document.getElementById('eventType').value=item.event_types[0]||'';}catch(error){profile.innerHTML=`<p>${error.message||'Network error. Try again.'}</p>`;}}
form.addEventListener('submit',async event=>{event.preventDefault();state.className='state';button.disabled=true;button.textContent='Sending invitation...';const data=Object.fromEntries(new FormData(form));data.organiser_id=organiserId;try{const response=await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw new Error(result.message||'Invitation failed.');state.className='state success show';state.textContent='Invitation sent — organiser notified by SMS.';button.textContent='Invitation sent';}catch(error){state.className='state error show';state.textContent=error.message.includes('fetch')?'Network error. Check your connection and try again.':error.message;button.disabled=false;button.textContent='Send invitation';}});load();
</script></body></html>
