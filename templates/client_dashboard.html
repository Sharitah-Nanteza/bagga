<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bagga | My Invitations</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--panel:#fff;--ink:#17212f;--muted:#667085;--line:#dfe7e4;--primary:#1b6f5f;--primary-soft:#dff6f0;--shadow:0 16px 36px rgba(18,31,36,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(180deg,#f7faf9,#edf2f1);color:var(--ink)}a{color:inherit;text-decoration:none}.shell{max-width:900px;margin:auto;padding:24px 18px}.topbar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.topbar{display:flex;justify-content:space-between;padding:15px 18px}.brand{font-weight:800}.nav{display:flex;gap:12px}.nav a{color:var(--muted);font-size:13px;font-weight:700}.hero{margin:25px 0}.eyebrow{color:var(--primary);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}h1{font-size:clamp(2rem,6vw,3.5rem);letter-spacing:-.07em;margin:13px 0}.muted,.empty{color:var(--muted);line-height:1.6}.list{display:grid;gap:12px}.booking{padding:18px;border:1px solid var(--line);border-radius:14px}.booking h2{font-size:1rem;margin:0 0 7px}.booking p{font-size:13px;margin:5px 0;color:var(--muted)}.status{display:inline-block;margin-top:8px;padding:6px 9px;border-radius:999px;background:#fff2db;color:#8f5e12;font-size:11px;font-weight:800;text-transform:uppercase}.accepted{background:var(--primary-soft);color:var(--primary)}.empty{text-align:center;padding:35px}.access{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}.access a{color:var(--primary);font-weight:700}@media(max-width:600px){.topbar{align-items:flex-start;flex-direction:column;gap:10px}}</style></head><body><main class="shell"><header class="topbar"><a class="brand" href="{{ url_for('home') }}">BAGGA</a><nav class="nav"><a href="{{ url_for('marketplace') }}">Marketplace</a><a href="{{ url_for('attendee') }}">USSD / Voice</a></nav></header><section class="hero"><span class="eyebrow">Client workspace</span><h1>Your invitations.</h1><p class="muted">See which organisers have received and responded to your event requests.</p></section><section class="panel" style="padding:22px"><div id="list" class="list"><div class="empty">Loading invitations...</div></div></section><p class="access">Need a no-smartphone channel? <a href="{{ url_for('attendee') }}">Use USSD / voice feedback</a>.</p></main><script>async function load(){const list=document.getElementById('list');try{const response=await fetch('/api/bookings');const data=await response.json();if(!response.ok)throw new Error(data.message);list.innerHTML=data.bookings.length?data.bookings.map(item=>`<article class="booking"><h2>${item.event_type} · ${item.event_date}</h2><p>${item.location}</p><p>${item.notes||'No notes added.'}</p><span class="status ${item.status}">${item.status}</span></article>`).join(''):'<div class="empty">You have not sent an invitation yet. <a href="/marketplace">Browse organisers</a>.</div>';}catch(error){list.innerHTML=`<div class="empty">${error.message||'Network error. Try again.'}</div>`;}}load();</script></body></html>
