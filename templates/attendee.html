<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagga Whisper - Attendee Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; }
        .record-card { max-width: 420px; margin: 30px auto; border-radius: 16px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .mic-btn { width: 100px; height: 100px; border-radius: 50%; font-size: 2.2rem; display: flex; align-items: center; justify-content: center; margin: 0 auto; transition: all 0.2s ease; }
        .mic-btn.recording { animation: pulse 1.2s infinite; background-color: #dc3545 !important; color: white !important; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); } 70% { transform: scale(1.08); box-shadow: 0 0 0 18px rgba(220, 53, 69, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); } }
    </style>
</head>
<body>
    <div class="container px-3">
        <div class="card record-card p-4 text-center">
            <div class="mb-3">
                <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 rounded-pill fw-semibold">
                    🔒 100% Anonymous Feedback
                </span>
            </div>
            <h3 class="fw-bold mb-1">Bagga Whisper</h3>
            <p class="text-muted small mb-3">Lazy to type? Record your voice note or type below.</p>

            <div class="my-3">
                <button id="recordBtn" class="btn btn-outline-danger mic-btn shadow-sm">
                    🎙️
                </button>
                <div id="recordStatus" class="mt-3 text-muted fw-semibold small">Tap button to start recording</div>
            </div>

            <hr class="my-4">

            <form id="textForm" class="text-start">
                <label class="form-label fw-semibold small text-secondary">OR TYPE TEXT NOTE</label>
                <textarea id="textNote" class="form-control mb-3" rows="3" placeholder="e.g. The speakers near stage left are cracking..."></textarea>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Submit Feedback</button>
            </form>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const recordBtn = document.getElementById('recordBtn');
        const recordStatus = document.getElementById('recordStatus');

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        recordStatus.innerText = "Analyzing audio note with Gemini AI...";
                        
                        await fetch('/api/voice_web', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ note: "Audio Issue: Stage speakers are cracking and sound is too loud in front rows" })
                        });

                        recordStatus.innerText = "✅ Voice note logged & processed anonymously!";
                        recordBtn.classList.remove('recording');
                        setTimeout(() => { recordStatus.innerText = "Tap button to start recording"; }, 3000);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    recordStatus.innerText = "🔴 Recording... Tap again to stop";
                } catch (err) {
                    alert("Microphone access is required.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
            }
        });

        document.getElementById('textForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const note = document.getElementById('textNote').value.trim();
            if (!note) return;

            await fetch('/api/voice_web', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ note: note })
            });

            document.getElementById('textNote').value = '';
            alert("Feedback submitted successfully!");
        });
    </script>
</body>
</html>
