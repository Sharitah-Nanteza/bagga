<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bagga | Sign in</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--panel:#fff;--ink:#17212f;--muted:#667085;--line:#dfe7e4;--primary:#1b6f5f;--primary-soft:#dff6f0;--danger-soft:#fde9e5;--shadow:0 16px 36px rgba(18,31,36,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(180deg,#f7faf9,#edf2f1);color:var(--ink)}a{color:inherit;text-decoration:none}.shell{max-width:620px;margin:auto;padding:24px 18px}.topbar{padding:15px 18px;background:#ffffffb3;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.brand{font-weight:800}.panel{margin-top:26px;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.eyebrow{color:var(--primary);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h1{font-size:clamp(2rem,6vw,3.4rem);letter-spacing:-.07em;margin:15px 0 8px}.lead,.access{color:var(--muted);line-height:1.6}.field{display:flex;flex-direction:column;gap:7px;margin-top:15px}label{font-size:13px;color:var(--muted);font-weight:700}input{padding:13px 14px;border:1px solid var(--line);border-radius:11px;font:inherit}.button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:11px;background:var(--primary);color:#fff;font:inherit;font-weight:800}.button:disabled{opacity:.65}.state{display:none;margin-top:14px;padding:13px;border-radius:11px;font-size:14px}.show{display:block}.error{background:var(--danger-soft);color:#9d3529}.success{background:var(--primary-soft);color:var(--primary)}.access{text-align:center;font-size:13px}.access a{color:var(--primary);font-weight:700}</style></head><body><main class="shell"><header class="topbar"><a class="brand" href="{{ url_for('home') }}">BAGGA</a></header><section class="panel"><span class="eyebrow">Welcome back</span><h1>Sign in to Bagga.</h1><p class="lead">Manage invitations, events, and your team from any phone.</p><form id="form"><div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" required placeholder="+256 700 000 000"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required></div><button id="button" class="button">Sign in</button><div id="state" class="state" role="status"></div></form><p class="access">New to Bagga? <a href="{{ url_for('register') }}">Create an account</a></p><p class="access"><a href="{{ url_for('attendee') }}">USSD / voice feedback</a> is available without a smartphone.</p></section></main><script>const form=document.getElementById('form'),button=document.getElementById('button'),state=document.getElementById('state');form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;button.textContent='Signing in...';state.className='state';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const result=await response.json();if(!response.ok)throw new Error(result.message);state.className='state success show';state.textContent='Signed in. Opening your workspace...';setTimeout(()=>location.href=result.user.role==='organiser'?'/organiser-dashboard':'/marketplace',350);}catch(error){state.className='state error show';state.textContent=error.message.includes('fetch')?'Network error. Try again.':error.message;button.disabled=false;button.textContent='Sign in';}});</script></body></html>
