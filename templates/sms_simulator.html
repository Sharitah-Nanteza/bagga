<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bagga | SMS Test</title>
<style>
:root{--bg:#f4f7f6;--panel:#fff;--ink:#17212f;--muted:#667085;--line:#dfe7e4;--primary:#1b6f5f;--soft:#dff6f0;--danger:#fde9e5;--shadow:0 16px 36px rgba(18,31,36,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(180deg,#f7faf9,#edf2f1);color:var(--ink)}.shell{max-width:700px;margin:auto;padding:24px 18px}.topbar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.topbar{display:flex;justify-content:space-between;padding:15px 18px}.brand,a{color:var(--primary);font-weight:800;text-decoration:none}.panel{margin-top:24px;padding:26px}.eyebrow{color:var(--primary);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h1{font-size:clamp(2rem,6vw,3.5rem);letter-spacing:-.07em;margin:14px 0 8px}.muted{color:var(--muted);line-height:1.6}.field{display:grid;gap:7px;margin-top:16px}label{font-size:13px;color:var(--muted);font-weight:700}input,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font:inherit}textarea{min-height:130px;resize:vertical}button{width:100%;margin-top:19px;padding:14px;border:0;border-radius:11px;background:var(--primary);color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.65}.state{display:none;margin-top:15px;padding:14px;border-radius:11px;line-height:1.55;font-size:14px}.state.show{display:block}.success{background:var(--soft);color:var(--primary)}.error{background:var(--danger);color:#9d3529}.result{margin-top:18px;padding:15px;border:1px solid var(--line);border-radius:12px;background:#fbfcfc;white-space:pre-wrap;font-family:monospace;font-size:13px}.access{text-align:center;color:var(--muted);font-size:13px;margin-top:20px}.access a{font-weight:700}@media(max-width:600px){.topbar{align-items:flex-start;flex-direction:column;gap:8px}}
</style>
</head>
<body><main class="shell"><header class="topbar"><a class="brand" href="{{ url_for('home') }}">BAGGA</a><a href="{{ url_for('dashboard') }}">Feedback dashboard</a></header><section class="panel"><span class="eyebrow">Africa's Talking sandbox</span><h1>Send a test SMS.</h1><p class="muted">This form calls the same SMS path used by guest invitations. Use a phone number registered in your Africa's Talking sandbox.</p><form id="smsForm"><div class="field"><label for="phone">Recipient phone</label><input id="phone" name="phone" required value="+256700000000" placeholder="+256700000000"></div><div class="field"><label for="message">Message</label><textarea id="message" name="message" required>Bagga test: your event invitation code is ABC123.</textarea></div><button id="sendButton">Send test SMS</button><div id="state" class="state" role="status"></div></form><pre id="result" class="result" hidden></pre></section><p class="access">Need feature-phone access? <a href="{{ url_for('attendee') }}">Test USSD / voice feedback</a>.</p></main><script>const form=document.getElementById('smsForm'),button=document.getElementById('sendButton'),state=document.getElementById('state'),result=document.getElementById('result');form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;button.textContent='Sending...';state.className='state';result.hidden=true;try{const response=await fetch('/api/sms/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await response.json();if(!response.ok)throw new Error(data.message||'SMS failed.');state.className='state success show';state.textContent=data.delivery.status==='simulated'?'Local simulator response received.':'Africa\'s Talking response received.';result.hidden=false;result.textContent=JSON.stringify(data.delivery,null,2);}catch(error){state.className='state error show';state.textContent=error.message.includes('fetch')?'Network error. Start Flask and try again.':error.message;}finally{button.disabled=false;button.textContent='Send test SMS';}});</script></body></html>
